name: Build Namma Metro Tracker

on:
  workflow_dispatch:
  push:
    branches: ["main", "v8-ui-estimated-live"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Compile debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Play Store App Bundle
        run: gradle :app:bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Namma-Metro-Tracker-v8.5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Namma-Metro-Tracker-v8.5-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
