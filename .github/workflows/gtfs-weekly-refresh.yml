name: Refresh BMRCL GTFS Model

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install sync dependency
        run: python -m pip install --disable-pip-version-check httpx==0.28.1
      - name: Download and normalize GTFS
        run: python backend/gtfs_sync.py
      - name: Commit updated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/gtfs_model.json
          git diff --cached --quiet || git commit -m "data: refresh BMRCL GTFS model"
          git push
